# =============================================================================
# One public origin, path-routed (PLAN/14 §7)
# =============================================================================
#
# The service boundary is real. The URL boundary does not have to be, and making
# it public buys nothing but exposure.
#
# Separate origins — auth.example.com and api.example.com — would force
# `SameSite=None; Secure` on the refresh cookie and CORS with credentials, which
# weakens CSRF posture in exchange for a topology nobody outside the deployment
# needs to know about. Path routing keeps the cookie first-party and
# `SameSite=Strict` available.
#
# This is a reference configuration. It is not run by `pnpm verify` and it is not
# the only proxy that would work; what matters are the three rules below, which
# any replacement must also satisfy.

upstream hrms_auth {
    server auth:3001;
}

upstream hrms_web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # Bodies here are JSON and small. The default is generous enough to be worth
    # tightening on the two services that accept unauthenticated input.
    client_max_body_size 2m;

    # -------------------------------------------------------------------------
    # RULE 1 — /internal/* is never reachable from outside.
    #
    # The authorization RPC lives there. The service ALSO guards it with a shared
    # secret, deliberately: a misconfigured proxy is a likelier failure than a
    # stolen secret, and one line of routing configuration must not be the only
    # thing between the internet and the endpoint that decides what tokens mean.
    #
    # 404 rather than 403 — a 403 confirms there is something there.
    # -------------------------------------------------------------------------
    location /internal/ {
        return 404;
    }

    # -------------------------------------------------------------------------
    # RULE 2 — /api/auth/* goes to the auth service.
    #
    # This path is also what scopes the refresh cookie (`Path=/api/auth`), so the
    # cookie is sent to exactly the service that needs it and to nothing else. A
    # request to /api/employees never carries it, and what is never sent cannot
    # leak.
    # -------------------------------------------------------------------------
    location /api/auth/ {
        proxy_pass http://hrms_auth;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location = /api/.well-known/jwks.json {
        proxy_pass http://hrms_auth;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # -------------------------------------------------------------------------
    # RULE 3 — everything else goes to the backend, including the UI.
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://hrms_web;
        include /etc/nginx/conf.d/proxy-common.inc;

        # Server-Sent Events. Measured behind a real nginx in ops/proxy-test:
        # events arrived in 0.08 s with buffering on, off, and with the stream
        # gzipped. This is set because it is correct and free, not because it was
        # observed to be load-bearing — see that directory for what the
        # measurement actually showed.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
