# =============================================================================
# HRMS — tumpukan lengkap
#
# Tiga kontainer, dan tidak lebih. Itu keputusan sadar, bukan tahap sementara
# (PLAN/12 §3.2): setiap komponen infrastruktur tambahan adalah sesuatu yang
# harus dijaga hidup oleh tim yang tidak punya SRE.
#
#   postgres  DATA      — satu basis data, schema per modul, RLS aktif.
#                         Merangkap sebagai antrean pekerjaan lewat pg-boss,
#                         sehingga tidak ada RabbitMQ maupun Redis yang perlu
#                         dijaga terpisah.
#   web       FRONTEND  — antarmuka pengguna DAN seluruh endpoint REST.
#                         Yang dilihat pengguna, dan yang dipanggil PWA nanti.
#   worker    BACKEND   — proses latar. Tidak menyajikan HTTP dan tidak dapat
#                         dijangkau dari luar; ia hanya menarik pekerjaan dari
#                         antrean. Di sinilah payroll dan impor Excel akan berjalan.
#
# Pemisahan web/worker adalah satu-satunya pemisahan proses dalam sistem, dan
# alasannya tunggal: pekerjaan berat tidak boleh menahan request pengguna.
#
# Untuk pengembangan sehari-hari, jangan pakai berkas ini — pakai
# `docker-compose.dev.yml` yang hanya menjalankan PostgreSQL, lalu jalankan web
# dan worker langsung di mesin. Hot reload jauh lebih cepat daripada membangun
# ulang image pada setiap perubahan.
#
#   Pengembangan : pnpm db:up            (postgres saja)
#   Tumpukan penuh: docker compose -f ops/docker-compose.yml up --build
# =============================================================================

name: hrms

services:
  # ---------------------------------------------------------------------------
  # DATA
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # PENYIAP VOLUME ARSIP WAL
  #
  # Volume Docker bernama lahir dimiliki root. PostgreSQL berjalan sebagai
  # pengguna `postgres` (uid 70 pada image alpine), sehingga `archive_command`
  # yang menulis ke sana **gagal — dan gagal secara diam-diam.**
  #
  # Bentuk kegagalannya persis yang paling berbahaya: `archive_mode=on` terpasang,
  # konfigurasinya terlihat benar di setiap tempat yang diperiksa orang, dan
  # tidak satu pun segmen pernah terarsip. Yang naik hanyalah
  # `pg_stat_archiver.failed_count`, dan tidak ada yang membacanya sampai ada
  # yang benar-benar mencoba memulihkan.
  #
  # Lebih buruk lagi: PostgreSQL MENAHAN segmen yang gagal diarsipkan dan
  # mencoba lagi selamanya. Disk penuh perlahan-lahan, dan penyebabnya tidak
  # terlihat dari mana pun kecuali dari log yang sudah tergulung.
  #
  # Ditemukan saat menguji PITR, sebelum konfigurasi ini pernah dipakai.
  wal-init:
    image: postgres:16-alpine
    container_name: hrms-wal-init
    user: root
    command: ['sh', '-c', 'mkdir -p /wal && chown 70:70 /wal && chmod 700 /wal']
    volumes:
      - hrms-wal:/wal
    restart: 'no'

  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres-full
    depends_on:
      wal-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrms_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
    volumes:
      - hrms-pgdata:/var/lib/postgresql/data
      # Membuat role runtime saat basis data pertama kali dibuat. Skrip ini
      # hanya berjalan pada volume kosong — pada volume yang sudah ada, role
      # dibuat oleh migrasi dan kata sandinya dipasang lewat runbook.
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # Arsip WAL. Volume TERPISAH dari data, dan itu bukan kerapian: arsip yang
      # berada di volume yang sama dengan datanya akan ikut hilang bersama
      # kerusakan yang membuatnya dibutuhkan.
      - hrms-wal:/wal
    # -------------------------------------------------------------------------
    # Point-in-time recovery
    #
    # Tanpa arsip WAL, kehilangan data maksimum sama dengan jarak antar-cadangan
    # — untuk cadangan harian, itu berarti sampai 24 jam pekerjaan hilang.
    # Dengan arsip WAL, kehilangannya turun menjadi selisih satu segmen, dan
    # pemulihan dapat diarahkan ke DETIK tertentu: tepat sebelum `DELETE` tanpa
    # `WHERE`, tepat sebelum migrasi yang salah.
    #
    # `archive_command` memakai `test ! -f` lebih dulu. Menimpa segmen arsip yang
    # sudah ada berarti menghancurkan rantai pemulihan tanpa satu pun galat —
    # PostgreSQL menganggap arsipnya berhasil, dan yang rusak baru ketahuan saat
    # pemulihan pertama yang sungguh-sungguh dibutuhkan.
    #
    # `archive_command` yang gagal membuat PostgreSQL MENAHAN segmennya dan
    # mencoba lagi. Itu perilaku yang benar dan berbahaya sekaligus: disk penuh
    # bila arsipnya tidak pernah berhasil. Runbook §7 menyebutkan cara
    # memantaunya.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal/%f && cp %p /wal/%f
      - -c
      - archive_timeout=300
      - -c
      - max_wal_senders=3
    ports:
      # Dipetakan ke 5433 supaya tidak bentrok dengan PostgreSQL yang mungkin
      # sudah berjalan di mesin pengembang.
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hrms_owner} -d ${POSTGRES_DB:-hrms}']
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # MIGRASI
  #
  # Berjalan sekali sampai selesai, lalu berhenti. web dan worker menunggunya
  # sukses sebelum dimulai — supaya tidak ada proses yang sempat menyentuh skema
  # versi lama.
  #
  # Memakai role owner, satu-satunya tempat kredensial itu dipakai. web dan
  # worker tidak pernah memilikinya.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.worker
    container_name: hrms-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hrms_owner:${POSTGRES_PASSWORD:-hrms_dev_password}@postgres:5432/${POSTGRES_DB:-hrms}
    working_dir: /repo/packages/db
    user: root
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  # ---------------------------------------------------------------------------
  # FRONTEND — antarmuka pengguna + REST API
  #
  # Ini satu-satunya kontainer yang terbuka ke luar. Ia melayani:
  #   /                halaman aplikasi (UI menyusul di Fase 2)
  #   /api/**          bidang tenant  — token audience `hrms-tenant`
  #   /admin/api/**    control plane  — token audience `hrms-admin`, TOTP wajib
  #
  # Kedua bidang itu memakai guard yang berbeda dan koneksi basis data yang
  # berbeda pula. `hrms_app` tidak dapat menyentuh schema `platform`, dan
  # `hrms_platform` tidak dapat membaca `auth.users` (P11).
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
    container_name: hrms-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Runtime memakai role aplikasi, bukan owner. Inilah yang membuat RLS
      # selalu berlaku: `hrms_app` bersifat NOBYPASSRLS dan bukan pemilik tabel.
      DATABASE_URL_APP: postgresql://hrms_app:${APP_DB_PASSWORD:-hrms_app_password}@postgres:5432/${POSTGRES_DB:-hrms}
      # Principal control plane. Hak aksesnya sengaja sempit: schema `platform`
      # dan metadata tenant, tanpa satu pun GRANT ke auth.users / iam.* / audit.*.
      DATABASE_URL_PLATFORM: postgresql://hrms_platform:${PLATFORM_DB_PASSWORD:-hrms_platform_password}@postgres:5432/${POSTGRES_DB:-hrms}
      # WAJIB diganti di produksi. Dua rahasia berbeda, supaya token tenant dan
      # token admin tidak pernah dapat saling diverifikasi.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib dipasang}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET wajib dipasang}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    ports:
      - '${WEB_PORT:-3000}:3000'

  # ---------------------------------------------------------------------------
  # BACKEND — proses latar
  #
  # Tidak membuka satu pun port. Tidak dapat dijangkau dari internet, dan tidak
  # perlu: ia menarik pekerjaan dari antrean, bukan menerima panggilan.
  #
  # Memakai principal `hrms_worker` yang punya satu pengecualian sempit — boleh
  # membaca outbox lintas tenant, karena pompa event adalah infrastruktur. Pada
  # seluruh tabel lain ia sama terkurungnya dengan `hrms_app`.
  #
  # Menskala pada panjang antrean, bukan jumlah request. Menambah replika di
  # sini aman: `FOR UPDATE SKIP LOCKED` membuat dua pompa mengambil baris yang
  # berlainan, bukan berebut baris yang sama.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: ops/Dockerfile.worker
    container_name: hrms-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # pg-boss mengelola schema antreannya sendiri, sehingga butuh hak DDL.
      DATABASE_URL: postgresql://hrms_owner:${POSTGRES_PASSWORD:-hrms_dev_password}@postgres:5432/${POSTGRES_DB:-hrms}
      DATABASE_URL_APP: postgresql://hrms_app:${APP_DB_PASSWORD:-hrms_app_password}@postgres:5432/${POSTGRES_DB:-hrms}
      DATABASE_URL_WORKER: postgresql://hrms_worker:${WORKER_DB_PASSWORD:-hrms_worker_password}@postgres:5432/${POSTGRES_DB:-hrms}

  # ---------------------------------------------------------------------------
  # Cadangan terjadwal
  # ---------------------------------------------------------------------------
  #
  # Berada di balik profil `backup`, sehingga tidak ikut menyala pada
  # `docker compose up` biasa:
  #
  #     docker compose --profile backup up -d
  #
  # **Tidak memasang socket Docker.** Memasang `/var/run/docker.sock` ke dalam
  # kontainer memberinya kendali penuh atas seluruh mesin — akses itu setara
  # root di host, dan menukarnya demi kenyamanan penjadwalan adalah pertukaran
  # yang buruk. Layanan ini memakai `pg_dump` yang sudah ada di dalam image
  # PostgreSQL, terhubung lewat jaringan seperti klien biasa.
  #
  # Penjadwalnya berupa gelung tidur, bukan cron. Alasannya bukan kesederhanaan:
  # cron di dalam kontainer menuntut proses init tersendiri, dan wadah dengan
  # dua proses membuat `docker logs` maupun sinyal berhenti berperilaku aneh.
  #
  # Yang harus diketahui sebagai gantinya: gelung tidur BERGESER. Bila cadangan
  # memakan lima menit, cadangan berikutnya mundur lima menit, dan setelah
  # sebulan waktunya sudah jauh dari yang dimaksud. Untuk penjadwalan yang harus
  # tepat waktu, pakai cron di host — lihat ops/RUNBOOK.md §6.
  backup:
    image: postgres:16-alpine
    profiles: ['backup']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: hrms_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:-hrms_dev_password}
      PGDATABASE: ${POSTGRES_DB:-hrms}
      # Jarak antar-cadangan. Ini juga kehilangan data maksimum bila terjadi
      # kerusakan — belum ada PITR, sehingga angka ini adalah RPO yang nyata.
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - hrms-backups:/backups
      # Berkas foto dan dokumen. Hanya-baca: proses cadangan tidak punya alasan
      # menulis ke sana, dan hak tulis yang tidak dipakai adalah hak yang dapat
      # disalahgunakan bila kontainer ini kelak dikompromikan.
      - hrms-storage:/storage:ro
    command:
      - sh
      - -c
      - |
        set -eu
        echo '{"scope":"backup","event":"started","intervalSeconds":'"$$BACKUP_INTERVAL_SECONDS"'}'
        while true; do
          STAMP=$$(date -u +%Y%m%dT%H%M%SZ)
          FILE="/backups/hrms-$$STAMP.dump"

          if pg_dump --format=custom --compress=9 --no-owner --no-privileges > "$$FILE"; then
            TABLES=$$(pg_restore --list "$$FILE" 2>/dev/null | grep -c "TABLE DATA" || true)
            SIZE=$$(du -h "$$FILE" | cut -f1)

            # Cadangan yang gagal separuh jalan tetap meninggalkan berkas.
            # Memeriksa daftar isinya sekarang jauh lebih murah daripada
            # menemukannya kosong saat sedang memulihkan.
            if [ "$$TABLES" -lt 10 ]; then
              echo '{"scope":"backup","level":"error","event":"suspect","tables":'"$$TABLES"'}' >&2
              rm -f "$$FILE"
            else
              tar -czf "/backups/hrms-$$STAMP-storage.tar.gz" -C / storage 2>/dev/null || true
              echo '{"scope":"backup","event":"ok","file":"'"$$FILE"'","size":"'"$$SIZE"'","tables":'"$$TABLES"'}'
            fi
          else
            echo '{"scope":"backup","level":"error","event":"failed"}' >&2
            rm -f "$$FILE"
          fi

          # Retensi per JUMLAH, bukan umur. Retensi berbasis umur menghapus
          # semuanya sekaligus bila layanan ini berhenti dua pekan lalu menyala
          # lagi — tepat ketika cadangan lama paling dibutuhkan.
          ls -1t /backups/hrms-*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | while read -r old; do
            rm -f "$$old" "$${old%.dump}-storage.tar.gz"
            echo '{"scope":"backup","event":"pruned","file":"'"$$old"'"}'
          done

          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

volumes:
  hrms-pgdata:
  hrms-backups:
  hrms-storage:
  hrms-wal:
