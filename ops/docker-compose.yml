# =============================================================================
# HRMS — the full stack
#
# Three containers, and no more. That is a conscious decision, not a temporary
# stage (PLAN/12 §3.2): every additional infrastructure component is something a
# team with no SRE has to keep alive.
#
#   postgres  DATA      — one database, a schema per module, RLS on. It doubles
#                         as the job queue through pg-boss, so there is no
#                         RabbitMQ and no Redis to keep alive separately.
#
#   web       FRONTEND  — the user interface AND every REST endpoint. What the
#                         user sees, and what the PWA calls later.
#   worker    BACKEND   — the background process. It serves no HTTP and cannot
#                         be reached from outside; it only pulls work from the
#                         queue. This is where payroll and Excel import run.
#
# The web/worker split is the only process split in the system, and its reason is
# single: heavy work must not hold up a user request.
#
# For day-to-day development, do not use this file — use
# `docker-compose.dev.yml`, which runs only PostgreSQL, then run web and worker
# directly on the machine. Hot reload is far faster than rebuilding an image on
# every change.
#
#   Development : pnpm db:up            (postgres only)
#   Full stack  : docker compose -f ops/docker-compose.yml up --build
# =============================================================================

name: hrms

services:
  # ---------------------------------------------------------------------------
  # DATA
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # THE WAL ARCHIVE VOLUME PREPARER
  #
  # A named Docker volume is born owned by root. PostgreSQL runs as the
  # `postgres` user (uid 70 on the alpine image), so an `archive_command`
  # writing there **fails — and fails silently.**
  #
  # The failure takes precisely the most dangerous shape: `archive_mode=on` is
  # set, the configuration looks right everywhere anyone checks, and not one
  # segment is ever archived. The only thing that rises is
  # `pg_stat_archiver.failed_count`, and nobody reads that until someone
  # genuinely tries to restore.
  #
  # Worse still: PostgreSQL RETAINS a segment that failed to archive and retries
  # forever. The disk fills slowly, and the cause is invisible from anywhere
  # except logs that have already rotated away.
  #
  # Found while testing PITR, before this configuration was ever used.
  wal-init:
    image: postgres:16-alpine
    container_name: hrms-wal-init
    user: root
    command: ['sh', '-c', 'mkdir -p /wal && chown 70:70 /wal && chmod 700 /wal']
    volumes:
      - hrms-wal:/wal
    restart: 'no'

  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres-full
    depends_on:
      wal-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrms_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
    volumes:
      - hrms-pgdata:/var/lib/postgresql/data
      # Creates the runtime roles when the database is first created. This script
      # only runs on an empty volume — on an existing one the roles are created by
      # migrations and their passwords set through the runbook.
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # The WAL archive. A SEPARATE volume from the data, and that is not
      # tidiness: an archive sitting on the same volume as the data would be lost
      # along with the damage that made it necessary.
      - hrms-wal:/wal
    # -------------------------------------------------------------------------
    # Point-in-time recovery
    #
    # Without a WAL archive, maximum data loss equals the interval between
    # backups — for a daily backup, that means up to 24 hours of work lost. With
    # a WAL archive the loss drops to one segment, and recovery can be aimed at a
    # particular SECOND: just before the `DELETE` without a `WHERE`, just before
    # the bad migration.
    #
    # `archive_command` runs `test ! -f` first. Overwriting an archive segment
    # that already exists destroys the recovery chain with not one error —
    # PostgreSQL considers the archive successful, and the damage only surfaces
    # during the first restore that is genuinely needed.
    #
    # An `archive_command` that fails makes PostgreSQL RETAIN the segment and try
    # again. That is both correct and dangerous: the disk fills if the archive
    # never succeeds. Runbook §7 describes how to monitor it.
    # memantaunya.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal/%f && cp %p /wal/%f
      - -c
      - archive_timeout=300
      - -c
      - max_wal_senders=3
    ports:
      # Mapped to 5433 so it does not clash with a PostgreSQL that may already be
      # running on a developer's machine.
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hrms_owner} -d ${POSTGRES_DB:-hrms}']
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # MIGRATIONS
  #
  # Runs once to completion, then stops. web and worker wait for it to succeed
  # before starting — so no process ever touches an older schema version.
  #
  # Uses the owner role, the only place those credentials are used. web and
  # worker never hold them.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.worker
    container_name: hrms-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hrms_owner:${POSTGRES_PASSWORD:-hrms_dev_password}@postgres:5432/${POSTGRES_DB:-hrms}
    working_dir: /repo/packages/db
    user: root
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  # ---------------------------------------------------------------------------
  # FRONTEND — the user interface + REST API
  #
  # This is the only container exposed to the outside. It serves:
  #   /                the application pages (the UI arrives in Phase 2)
  #   /api/**          the tenant plane  — token audience `hrms-tenant`
  #   /admin/api/**    the control plane — token audience `hrms-admin`, TOTP required
  #
  # The two planes use different guards and different database connections.
  # `hrms_app` cannot touch the `platform` schema, and `hrms_platform` cannot
  # read `auth.users` (P11).
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
    container_name: hrms-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # The runtime uses the application role, not the owner. This is what keeps
      # RLS always in force: `hrms_app` is NOBYPASSRLS and is not the table owner.
      DATABASE_URL_APP: postgresql://hrms_app:${APP_DB_PASSWORD:-hrms_app_password}@postgres:5432/${POSTGRES_DB:-hrms}
      # The control plane principal. Its rights are deliberately narrow: the
      # `platform` schema and tenant metadata, with no GRANT into auth/iam/audit.
      DATABASE_URL_PLATFORM: postgresql://hrms_platform:${PLATFORM_DB_PASSWORD:-hrms_platform_password}@postgres:5432/${POSTGRES_DB:-hrms}
      # MUST be changed in production. Two different secrets, so a tenant token
      # and an admin token can never verify against each other.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib dipasang}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET wajib dipasang}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
    ports:
      - '${WEB_PORT:-3000}:3000'

  # ---------------------------------------------------------------------------
  # BACKEND — the background process
  #
  # Opens no port at all. Unreachable from the internet, and it does not need to
  # be: it pulls work from a queue rather than receiving calls.
  #
  # Uses the `hrms_worker` principal, which has one narrow exception — it may
  # read the outbox across tenants, because the event pump is infrastructure. On
  # every other table it is as boxed in as `hrms_app`.
  #
  # It scales on queue length, not request count. Adding replicas here is safe:
  # `FOR UPDATE SKIP LOCKED` makes two pumps take different rows rather than
  # fight over the same one.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: ops/Dockerfile.worker
    container_name: hrms-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # pg-boss manages its own queue schema, so it needs DDL rights.
      DATABASE_URL: postgresql://hrms_owner:${POSTGRES_PASSWORD:-hrms_dev_password}@postgres:5432/${POSTGRES_DB:-hrms}
      DATABASE_URL_APP: postgresql://hrms_app:${APP_DB_PASSWORD:-hrms_app_password}@postgres:5432/${POSTGRES_DB:-hrms}
      DATABASE_URL_WORKER: postgresql://hrms_worker:${WORKER_DB_PASSWORD:-hrms_worker_password}@postgres:5432/${POSTGRES_DB:-hrms}

  # ---------------------------------------------------------------------------
  # Scheduled backups
  # ---------------------------------------------------------------------------
  #
  # Behind the `backup` profile, so it does not start on an ordinary
  # `docker compose up`:
  #
  #     docker compose --profile backup up -d
  #
  # **It mounts no Docker socket.** Mounting `/var/run/docker.sock` into a
  # container gives it full control of the whole machine — that access is
  # equivalent to root on the host, and trading it for scheduling convenience is
  # a bad trade. This service uses the `pg_dump` already inside the PostgreSQL
  # image, connecting over the network like any other client.
  #
  # Its scheduler is a sleep loop, not cron. The reason is not simplicity: cron
  # inside a container demands an init process of its own, and a container with
  # two processes makes both `docker logs` and stop signals behave strangely.
  #
  # What has to be known instead: a sleep loop DRIFTS. If a backup takes five
  # minutes, the next one starts five minutes later, and after a month its time
  # is far from what was intended. For scheduling that must be punctual, use cron
  # on the host — see ops/RUNBOOK.md §6.
  backup:
    image: postgres:16-alpine
    profiles: ['backup']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: hrms_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:-hrms_dev_password}
      PGDATABASE: ${POSTGRES_DB:-hrms}
      # The interval between backups. It is also the maximum data loss in a
      # disaster — there is no PITR yet, so this number is the real RPO.
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - hrms-backups:/backups
      # Photo and document files. Read-only: the backup process has no reason to
      # write there, and an unused write right is a right that can be abused if
      # this container is ever compromised.
      - hrms-storage:/storage:ro
    command:
      - sh
      - -c
      - |
        set -eu
        echo '{"scope":"backup","event":"started","intervalSeconds":'"$$BACKUP_INTERVAL_SECONDS"'}'
        while true; do
          STAMP=$$(date -u +%Y%m%dT%H%M%SZ)
          FILE="/backups/hrms-$$STAMP.dump"

          if pg_dump --format=custom --compress=9 --no-owner --no-privileges > "$$FILE"; then
            TABLES=$$(pg_restore --list "$$FILE" 2>/dev/null | grep -c "TABLE DATA" || true)
            SIZE=$$(du -h "$$FILE" | cut -f1)

            # A backup that failed halfway still leaves a file behind. Checking its
            # table of contents now is far cheaper than finding it empty during a
            # restore.
            if [ "$$TABLES" -lt 10 ]; then
              echo '{"scope":"backup","level":"error","event":"suspect","tables":'"$$TABLES"'}' >&2
              rm -f "$$FILE"
            else
              tar -czf "/backups/hrms-$$STAMP-storage.tar.gz" -C / storage 2>/dev/null || true
              echo '{"scope":"backup","event":"ok","file":"'"$$FILE"'","size":"'"$$SIZE"'","tables":'"$$TABLES"'}'
            fi
          else
            echo '{"scope":"backup","level":"error","event":"failed"}' >&2
            rm -f "$$FILE"
          fi

          # Retention by COUNT, not age. Age-based retention deletes everything at
          # once if this service stops for two weeks and then starts again —
          # exactly when the old backups are needed most.
          ls -1t /backups/hrms-*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | while read -r old; do
            rm -f "$$old" "$${old%.dump}-storage.tar.gz"
            echo '{"scope":"backup","event":"pruned","file":"'"$$old"'"}'
          done

          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

volumes:
  hrms-pgdata:
  hrms-backups:
  hrms-storage:
  hrms-wal:
