# =============================================================================
# HRMS — PostgreSQL untuk pengembangan lokal
#
# Sengaja HANYA basis data. `web` (frontend + API) dan `worker` (proses latar)
# dijalankan langsung di mesin dengan `pnpm dev`, karena hot reload jauh lebih
# cepat daripada membangun ulang image pada setiap perubahan berkas.
#
# Untuk menjalankan ketiganya sebagai kontainer — mendekati produksi, atau saat
# memeriksa masalah yang hanya muncul di image — pakai `docker-compose.yml`.
#
# PostgreSQL di sini merangkap tiga peran, dan itu yang membuat tumpukan ini
# dapat dioperasikan satu orang (PLAN/12 §3.2):
#   - basis data aplikasi (satu DB, schema per modul, RLS aktif)
#   - antrean pekerjaan lewat pg-boss  → tanpa RabbitMQ
#   - kunci terdistribusi lewat advisory lock → tanpa Redis
#
#   pnpm db:up          menjalankan
#   pnpm db:migrate     menerapkan migrasi
#   pnpm db:seed        mengisi katalog + tenant demo + superuser demo
# =============================================================================

name: hrms-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms_owner
      POSTGRES_PASSWORD: hrms_dev_password
      POSTGRES_DB: hrms
    ports:
      # 5433, bukan 5432, supaya tidak bentrok dengan PostgreSQL yang mungkin
      # sudah terpasang di mesin pengembang.
      - '5433:5432'
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data.
      #
      # The postgres:18 image moved PGDATA to /var/lib/postgresql/18/docker and
      # declares its volume one level up. Keeping the old path would leave the
      # named volume mounted somewhere the server never writes: the container
      # starts, initialises a fresh cluster inside its own writable layer, and
      # everything works — until the container is replaced and every row is gone,
      # with no error at any point before that.
      - hrms-pgdata:/var/lib/postgresql
      # Membuat role runtime (hrms_app, hrms_worker, hrms_platform) beserta kata
      # sandi pengembangan. Hanya berjalan saat volume masih kosong; role itu
      # sendiri dibuat oleh migrasi, sehingga produksi tidak pernah mewarisi
      # kredensial dari git.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms_owner -d hrms']
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis — hanya untuk pembatas laju bersama (PLAN/14 §9.2).
  #
  # Opsional. Tanpa REDIS_URL aplikasi memakai penghitung dalam proses dan
  # berjalan persis seperti sebelumnya. Ia menjadi WAJIB begitu `web` berjalan
  # lebih dari satu replika: penghitung dalam proses membuat setiap replika
  # menghitung sendiri, sehingga batas efektifnya berlipat sebanyak replikanya —
  # tanpa galat, tanpa log, dan tanpa cara mengetahuinya dari luar.
  #
  # Tidak ada volume dengan sengaja. Isinya hanya penghitung berumur pendek;
  # kehilangan seluruhnya saat restart berarti satu jendela laju terlewat, bukan
  # data yang hilang. Menyimpannya justru mengundang anggapan bahwa ia boleh
  # dipakai untuk hal yang tidak boleh hilang.
  redis:
    image: redis:8-alpine
    container_name: hrms-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hrms-pgdata:
