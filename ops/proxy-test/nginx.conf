# 8080 — a DEFAULT nginx. proxy_buffering is on, which is nginx's default and
# what an operator who has never thought about SSE will have.
server {
    listen 8080;
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}

# 8090 — the same, except X-Accel-Buffering is IGNORED.
#
# This is the mutation test. It is not a configuration anyone should run; it
# exists to prove the application header is what defeats buffering, rather than
# the events happening to be large enough to flush on their own. If 8080 and
# 8090 behave identically, the header is decorative and the dashboard is only
# working by accident.
server {
    listen 8090;
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_ignore_headers X-Accel-Buffering;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}

# 8100 — gzip enabled for proxied responses, including event streams.
#
# This is the configuration that genuinely breaks SSE in the field, and it is not
# exotic: `gzip_proxied any` appears in a great many hardening guides. A gzip
# stream has its own buffer, so events are held until the compressor decides to
# flush — which for short events can be indefinitely.
#
# `cache-control: no-transform` is already sent by the application and nginx is
# documented to honour it. This block is what proves whether it actually does.
server {
    listen 8100;
    gzip on;
    gzip_proxied any;
    gzip_types text/event-stream text/plain application/json;
    gzip_min_length 0;

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "gzip";
        proxy_read_timeout 300s;
    }
}
